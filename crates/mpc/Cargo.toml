[package]
name = "vmpckks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
p3-air = { path = "../../vendor/Plonky3/air" }
p3-batch-stark = { path = "../../vendor/Plonky3/batch-stark", features = ["parallel"] }
p3-challenger = { path = "../../vendor/Plonky3/challenger" }
p3-commit = { path = "../../vendor/Plonky3/commit" }
p3-dft = { path = "../../vendor/Plonky3/dft" }
p3-field = { path = "../../vendor/Plonky3/field" }
p3-fri = { path = "../../vendor/Plonky3/fri", features = ["parallel"] }
p3-goldilocks = { path = "../../vendor/Plonky3/goldilocks" }
p3-lookup = { path = "../../vendor/Plonky3/lookup" }
p3-matrix = { path = "../../vendor/Plonky3/matrix" }
p3-merkle-tree = { path = "../../vendor/Plonky3/merkle-tree", features = ["parallel"] }
p3-security = { path = "../../vendor/Plonky3/security" }
p3-sha256 = { path = "../../vendor/Plonky3/sha256" }
p3-sha256-air = { path = "../../vendor/Plonky3/sha256-air" }
p3-symmetric = { path = "../../vendor/Plonky3/symmetric" }
p3-uni-stark = { path = "../../vendor/Plonky3/uni-stark", features = ["parallel"] }
rand = "=0.10.3"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.154"
